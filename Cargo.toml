[package]
name = "glint"
version = "1.1.0"
edition = "2024"
description = "A small, pretty text editor with animated backgrounds"

[dependencies]
winit = "0.30.13"
wgpu = "30"
glyphon = "0.12"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
ropey = "1.6"
syntect = "5.3"
two-face = "0.5"
unicode-width = "0.2"
unicode-segmentation = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "6"
rfd = "0.16"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
png = "0.18"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
